name: 🤖 AI-Powered Development Workflow

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 9 AM UTC
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      ai_task:
        description: 'AI Task to Execute'
        required: true
        default: 'daily-workflow'
        type: choice
        options:
          - daily-workflow
          - code-analysis
          - documentation
          - code-review
          - refactor-suggestions

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.check-changes.outputs.has-changes }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔍 Check for Changes
        id: check-changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has-changes=true" >> $GITHUB_OUTPUT
          elif git diff --quiet HEAD^ HEAD; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
          else
            echo "has-changes=true" >> $GITHUB_OUTPUT
          fi

  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🚀 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 QA Validation
        run: npm run qa:validate

      - name: 🔍 Lint Code
        run: npm run lint

      - name: 🎨 Check Code Formatting
        run: npm run format:check

      - name: 🧪 Run Tests
        run: npm run test:coverage

      - name: 📊 Upload Coverage Reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [quality-checks]
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🚀 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Project
        run: npm run build

      - name: 📦 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  ai-code-analysis:
    needs: setup
    if: needs.setup.outputs.has-changes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🚀 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🤖 AI Code Analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${{ github.event.inputs.ai_task || 'daily-workflow' }}" in
            "code-analysis")
              npm run ai:analyze-code
              ;;
            "documentation")
              npm run ai:generate-docs
              ;;
            "code-review")
              npm run ai:code-review
              ;;
            "refactor-suggestions")
              npm run ai:refactor-suggestions
              ;;
            *)
              npm run ai:daily-workflow
              ;;
          esac

      - name: 📊 Upload AI Analysis Results
        uses: actions/upload-artifact@v4
        with:
          name: ai-analysis-results
          path: |
            temp/ai-outputs/
            logs/ai-conversations/
          retention-days: 30
        continue-on-error: true

  deploy-dev:
    needs: [quality-checks, build]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # environment: development  # Uncomment when GitHub environment is created
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🚀 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📦 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/

      - name: 🚀 Deploy to Development
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: npm run deploy:dev

  deploy-prod:
    needs: [quality-checks, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # environment: production   # Uncomment when GitHub environment is created
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🚀 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📦 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/

      - name: 🚀 Deploy to Production
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: npm run deploy:prod

  ai-insights:
    runs-on: ubuntu-latest
    if: always()
    needs: [ai-code-analysis, quality-checks, build]
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🚀 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📊 Generate AI Insights Report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## 🤖 AI Development Insights" > ai-insights.md
          echo "" >> ai-insights.md
          echo "### Workflow Summary" >> ai-insights.md
          echo "- **Trigger**: ${{ github.event_name }}" >> ai-insights.md
          echo "- **Branch**: ${{ github.ref_name }}" >> ai-insights.md
          echo "- **Commit**: ${{ github.sha }}" >> ai-insights.md
          echo "- **AI Task**: ${{ github.event.inputs.ai_task || 'daily-workflow' }}" >> ai-insights.md
          echo "" >> ai-insights.md
          
          # Run AI log analysis
          npm run logs:analyze >> ai-insights.md

      - name: 💬 Comment AI Insights on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const insights = fs.readFileSync('ai-insights.md', 'utf8');
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: insights
              });
            } catch (error) {
              console.log('Could not post AI insights comment:', error.message);
            }
        continue-on-error: true

      - name: 📊 Upload Insights Report
        uses: actions/upload-artifact@v4
        with:
          name: ai-insights-report
          path: ai-insights.md
          retention-days: 90
        continue-on-error: true
